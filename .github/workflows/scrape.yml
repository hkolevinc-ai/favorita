name: Favorita to Temu scraper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run scraper
        run: python favorita_scraper.py --output output/favorita_temu_upload.xlsx

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: favorita-temu-results
          path: output/favorita_temu_upload.xlsx
          if-no-files-found: error
          retention-days: 30
